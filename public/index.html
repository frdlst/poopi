<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poopi</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/hljs-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/hljs-dark.css" media="(prefers-color-scheme: dark)">
<script type="module" src="/app.js"></script>
<body>
<aside id="sessions" class="side">
	<h2>Sessions</h2>
	<p><a href="#">+ New session</a></p>
	<ul id="session-list"></ul>
	<details id="archived" hidden>
		<summary>Archived</summary>
		<ul id="archived-list"></ul>
	</details>
</aside>
<div class="divider" role="separator" aria-orientation="vertical" aria-label="Resize sessions" tabindex="0" data-target="sessions" data-edge="right"></div>
<main>
	<div id="scroll">
		<div id="transcript"></div>
		<div id="live"></div>
	</div>
	<p id="error" class="error" role="alert"></p>
	<p id="notice" class="note" role="status"></p>
	<details id="extras">
		<summary>Skills and extensions</summary>
		<ul id="skills"></ul>
		<ul id="extensions"></ul>
	</details>
	<form id="composer">
		<div id="attachments"></div>
		<div class="divider" role="separator" aria-orientation="horizontal" aria-label="Resize message box" tabindex="0" data-target="input" data-edge="top"></div>
		<textarea id="input" rows="3" aria-label="Message"
			placeholder="Enter to send (steers while busy), Alt+Enter to queue a follow-up, Shift+Enter for a new line, paste images"></textarea>
		<footer>
			<span id="stats"></span>
			<span>
				<input id="attach" type="file" accept="image/*" multiple aria-label="Attach images">
				<button id="stop" type="button" hidden>Stop</button>
				<select id="provider" aria-label="Provider"></select>
				<select id="model" aria-label="Model"></select>
				<select id="effort" aria-label="Effort"></select>
			</span>
		</footer>
	</form>
</main>
<div class="divider" role="separator" aria-orientation="vertical" aria-label="Resize branches" tabindex="0" data-target="branches" data-edge="left"></div>
<aside id="branches" class="side">
	<h2>Branches</h2>
	<div id="tree"></div>
</aside>
</body>
</html>
